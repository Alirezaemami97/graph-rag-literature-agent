[tool.poetry]
name = "alireza-literature-agent"
version = "0.1.0"
description = "Production-style agentic Graph RAG literature research system"
authors = ["Alirezaemami97"]
readme = "README.md"
packages = [{include = "litagent", from = "src"}]

[tool.poetry.dependencies]
python = "~3.12"
pydantic = "^2.7"
pyyaml = "^6.0"
httpx = "^0.27"
chromadb = "^0.5"
neo4j = "^5.20"
openai = "^1.30"
langchain-text-splitters = "^0.3"
tenacity = "^8.3"
rank-bm25 = "0.2.2"
langchain = "^0.3"
langchain-openai = "^0.2"
langgraph = "^0.2"
langsmith = ">=0.1.17,<0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.4"
mypy = "^1.10"
types-pyyaml = "^6.0.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["litagent"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
